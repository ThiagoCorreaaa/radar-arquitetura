name: Atualizar notícias

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar news.json
        run: node scripts/build-news.mjs

      - name: Publicar se houve mudança
        run: |
          git config user.name "radar-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nas notícias."
          else
            git commit -m "Atualiza notícias ($(date -u +%Y-%m-%d))"
            git push
          fi
          
